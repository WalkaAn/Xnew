name: Build

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "[0-9]*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Signing opsional: isi 4 secret ini di Settings > Secrets and variables > Actions
  # KEYSTORE_JKS_BASE64, KEY_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
  HAS_KEYSTORE: ${{ secrets.KEYSTORE_JKS_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: archive/app/*debug*.apk

      - name: Build Release
        if: env.HAS_KEYSTORE == 'true'
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p release-apk
          cp archive/app/*release-unsigned.apk release-apk/

      - name: Sign Release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: release-apk
          signingKeyBase64: ${{ secrets.KEYSTORE_JKS_BASE64 }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename signed APK
        if: env.HAS_KEYSTORE == 'true'
        run: |
          for f in release-apk/*unsigned-signed.apk; do
            mv "$f" "${f/unsigned-signed/signed}"
          done

      - name: Upload Release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: release-apk/*-signed.apk

      - name: Publish GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apk/*-signed.apk
            archive/app/*debug*.apk
