name: Extract ZIP and Build APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/extract-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and extract uploaded project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Tidak ditemukan file ZIP di halaman utama repository."
            exit 1
          fi
          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project
          GRADLEW="$(find extracted-project -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "File gradlew tidak ditemukan di dalam ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$GRADLEW"
          echo "Proyek ditemukan di: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAudioCapture-debug-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
